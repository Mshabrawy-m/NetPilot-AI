# NetPilot AI - STREAMLIT COMMUNITY CLOUD secrets (TEMPLATE).
#
# Paste this into the Cloud app:  Settings -> Secrets -> (raw editor).
# Community Cloud promotes these keys to os.environ BEFORE the app script runs
# (proven in NETPILOT_GATE2_STREAMLIT_CLOUD_DEPLOY_RUNBOOK.md §3.1), so
# config.py reads them via os.getenv with NO code bridge.
#
# This plane is READ-ONLY: it renders live rows and runs analytics. It never
# collects and never runs DDL. Therefore ONLY the app-reader role DSN appears
# here - never the collector, retention, rollup, or administrator DSN.
#
# For local runs the equivalent git-ignored file is .streamlit/secrets.toml
# (already git-ignored). Every value below is a PLACEHOLDER; the operator
# supplies real values in the Cloud UI only - never commit them.

# --- Mode: live reader ------------------------------------------------------
NETPILOT_DEMO_MODE = "false"

# --- Database: app reader role only ----------------------------------------
# Point at the SAME persistent Neon production branch the collector writes to.
# The reader role (netpilot_app) has SELECT + limited INSERT/UPDATE and NO
# DELETE/DDL; schema management is off on the hosted plane.
NETPILOT_DB_URL_APP = "postgresql+psycopg2://netpilot_app:CHANGE_ME@CHANGE_ME-neon-endpoint:5432/netpilot?sslmode=require"
# Leave DATABASE_URL empty so role separation stays authoritative and the
# reader can never fall back to another role's connection.
DATABASE_URL = ""

# --- PostgreSQL TLS ---------------------------------------------------------
NETPILOT_PG_SSLMODE = "require"
NETPILOT_PG_CONNECT_TIMEOUT = "10"

# --- Serverless pool tuning (Neon). Keep recycle below the provider idle
#     timeout; the reader is a shared pool, unlike the one-shot collector. -----
NETPILOT_PG_POOL_SIZE = "3"
NETPILOT_PG_MAX_OVERFLOW = "3"
NETPILOT_PG_POOL_RECYCLE = "60"
NETPILOT_PG_POOL_TIMEOUT = "30"
# Forecasting / rollup-read queries on the hosted reader may legitimately run
# longer than the collector's tiny writes; raise only if a real query is cut
# off. 0 disables the timeout.
NETPILOT_PG_STATEMENT_TIMEOUT_MS = "15000"

# --- Schema management OFF on the hosted plane (DDL is run once elsewhere) --
NETPILOT_MANAGE_SCHEMA = "false"

# --- Safety gates: the hosted app must stay inert ----------------------------
NETPILOT_CHANGE_LOOP_ENABLED = "false"
NETPILOT_LAB_EXECUTION_ENABLED = "false"

# --- Authentication / RBAC (opt-in; keep false to preserve current behaviour)-
NETPILOT_AUTH_ENABLED = "false"
# If you enable auth, the bootstrap admin password is supplied HERE only, never
# in a committed file or source.
NETPILOT_ADMIN_USER = ""
NETPILOT_ADMIN_PASSWORD = ""

# --- Groq AI assistant (optional). Put a real key ONLY in this Cloud secrets
#     UI (or local .env), never here and never in a PR. -----------------------
GROQ_API_KEY = ""
GROQ_MODEL = "openai/gpt-oss-20b"
