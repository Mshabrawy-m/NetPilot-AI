# NetPilot AI — global Streamlit theme ("Mission Control / Network-Ops").
# Applied automatically to every page. Colours here pair with the CSS layer in
# ui/theme.py. Fonts are pulled in by ui/theme.py via @import at runtime.
[theme]
base = "dark"
primaryColor = "#38BDF8"          # electric cyan — actions & accents
backgroundColor = "#0A0E1A"        # deep space-navy canvas
secondaryBackgroundColor = "#131A2B"  # surfaces, cards, inputs
textColor = "#E6EDF7"
linkColor = "#7DD3FC"
borderColor = "#233049"
codeFont = "'JetBrains Mono', 'Fira Code', monospace"
headingFont = "'Space Grotesk', 'Inter', sans-serif"
font = "'Inter', system-ui, sans-serif"
baseRadius = "14px"
buttonRadius = "10px"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#141C2E"
textColor = "#C7D2E6"
borderColor = "#1C2540"
linkColor = "#7DD3FC"

# Streamlit's file watcher evicts watched application modules from
# ``sys.modules`` at the start of a run (watcher/local_sources_watcher.py,
# ``flush_pending_evictions``). Two libraries resolve a class's defining module
# through ``sys.modules`` *while its class body is executing* - SQLAlchemy for
# ``Mapped[...]`` annotations and CPython's ``dataclasses`` for the ``__module__``
# / ``__qualname__`` strings - so a concurrent eviction crashed the deployed app
# right after a rebuild with ``MappedAnnotationError`` and then ``AttributeError:
# 'NoneType' object has no attribute '__dict__'``. Deployment never edits files,
# so the watcher is off. ``server.fileWatcherType`` is not a scriptable option,
# so neither an environment variable nor a CLI flag can override this: while
# developing locally, change this value back to "auto" in your working copy to
# restore auto-rerun-on-save (the committed value must stay "none").
[server]
fileWatcherType = "none"

[browser]
gatherUsageStats = false
