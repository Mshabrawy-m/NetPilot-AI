! R3 - NetPilot AI Phase 1 lab router (FRRouting)
! Segments: eth1 -> R1 (10.0.13.0/24), eth2 -> PC2 (10.0.32.0/24)
hostname R3
!
interface lo
 ip address 10.1.1.3/32
!
interface eth1
 description to_R1_eth2
 ip address 10.0.13.3/24
!
interface eth2
 description to_PC2_eth1
 ip address 10.0.32.3/24
!
router ospf 100
 ospf router-id 10.1.1.3
 network 10.0.13.0/24 area 0
 network 10.0.32.0/24 area 0
 network 10.1.1.3/32 area 0
!
line vty
!
