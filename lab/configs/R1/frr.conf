! R1 - NetPilot AI Phase 1 lab router (FRRouting)
! Segments: eth1 -> R2 (10.0.12.0/24), eth2 -> R3 (10.0.13.0/24)
hostname R1
!
interface lo
 ip address 10.1.1.1/32
!
interface eth1
 description to_R2_eth1
 ip address 10.0.12.1/24
!
interface eth2
 description to_R3_eth1
 ip address 10.0.13.1/24
!
router ospf 100
 ospf router-id 10.1.1.1
 network 10.0.12.0/24 area 0
 network 10.0.13.0/24 area 0
 network 10.1.1.1/32 area 0
!
line vty
!
