! R2 - NetPilot AI Phase 1 lab router (FRRouting)
! Segments: eth1 -> R1 (10.0.12.0/24), eth2 -> PC1 (10.0.21.0/24)
hostname R2
!
interface lo
 ip address 10.1.1.2/32
!
interface eth1
 description to_R1_eth1
 ip address 10.0.12.2/24
!
interface eth2
 description to_PC1_eth1
 ip address 10.0.21.2/24
!
router ospf 100
 ospf router-id 10.1.1.2
 network 10.0.12.0/24 area 0
 network 10.0.21.0/24 area 0
 network 10.1.1.2/32 area 0
!
line vty
!
