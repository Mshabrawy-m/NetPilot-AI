# NetPilot AI - CI (v2 Slice 8).
# The whole suite is offline by design: no API keys, no network, no Docker
# needed to be green. Four gates, all required:
#   1. secret hygiene scan  - nothing that looks like a .env or key lands
#   2. installability       - requirements.txt resolves as Linux wheels, 3.10-3.13
#   3. pytest matrix        - Python 3.11 + 3.12 (pure-Python deps, no lab)
#   4. headless UI smoke    - Streamlit AppTest over app.py + every page
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No environment files may be committed
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::Refusing to build with committed env files: $found"
            exit 1
          fi
      - name: Hard-coded credential scan (tested tool, single source of truth)
        run: python tools/secret_scan_check.py

  installability:
    # requirements.txt is also what Streamlit Community Cloud installs, and the
    # platform lets the deployer pick the interpreter. If any pin has no Linux
    # wheel for that interpreter pip aborts the whole install - the container is
    # left with NOTHING, and the app dies on its first third-party import while
    # Streamlit redacts the reason. That happened in production (a redacted
    # ModuleNotFoundError on dotenv), so the range a deployer may choose is
    # asserted here instead of discovered later.
    # Measured on 2026-10-15 against PyPI Linux wheels: 3.10-3.13 resolve, 3.9
    # fails (no streamlit wheel) and 3.14 fails on our own scikit-learn ceiling
    # - `scikit-learn>=1.4,<1.6` reports "from versions: 1.7.2", because 1.7.2
    # is the first release publishing cp314 manylinux wheels. pandas and
    # sqlalchemy are NOT the blocker (both ship cp314 wheels), so widening the
    # scikit-learn ceiling is what would unlock the 3.14 interpreter that Cloud
    # now defaults to. Until then the matrix stops at 3.13 and the README tells
    # deployers to select 3.11 or 3.12.
    needs: secret-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - py: "3.10"
            abi: cp310
          - py: "3.11"
            abi: cp311
          - py: "3.12"
            abi: cp312
          - py: "3.13"
            abi: cp313
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve requirements.txt for CPython ${{ matrix.py }} (Linux wheels only)
        run: |
          set -euo pipefail
          python -m pip install -U pip
          if ! python -m pip install --dry-run --ignore-installed --no-cache-dir \
               --only-binary=:all: --python-version "${{ matrix.py }}" \
               --implementation cp --abi ${{ matrix.abi }} \
               --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64 \
               --target "$RUNNER_TEMP/np-resolve" -r requirements.txt; then
            echo "::error::requirements.txt is not installable from Linux wheels on CPython ${{ matrix.py }}. A hosted deploy using that interpreter would install nothing and crash on import."
            exit 1
          fi

  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov
      - name: Syntax gate
        run: python -m compileall -q app.py api analytics database network services pages ai
      - name: Offline pytest suite (coverage summary)
        run: pytest --cov=. --cov-report=term-missing:skip-covered
        env:
          # No secrets exist in CI by design; the suite must pass without any.
          GROQ_API_KEY: ""

  ui-smoke:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Headless UI smoke (every page via Streamlit AppTest)
        run: python tests/ui_smoke_check.py

  docker-build:
    # Build-only smoke: proves the Dockerfile/compose files parse and the
    # image assembles. The stack itself is verified manually on a Docker host.
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
